<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="t d"><title id="t">Fluxo de recuperação do erro 1962</title><desc id="d">Etapas ilustradas: instalar ZimaOS, iniciar Boot Repair Disk, identificar e montar partição EFI, criar entrada UEFI e reiniciar.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#091729"/><stop offset="1" stop-color="#173655"/></linearGradient></defs><rect width="1400" height="520" rx="28" fill="url(#b)"/><text x="700" y="62" text-anchor="middle" fill="#f3f8ff" font-family="Arial,sans-serif" font-size="32" font-weight="700">VISÃO GERAL DO PROCEDIMENTO</text><g font-family="Arial,sans-serif" text-anchor="middle"><g><rect x="55" y="145" width="220" height="220" rx="22" fill="#17334f" stroke="#4e91c2" stroke-width="3"/><circle cx="165" cy="205" r="34" fill="#2b83bf"/><text x="165" y="216" fill="white" font-size="30" font-weight="700">1</text><text x="165" y="275" fill="#fff" font-size="22" font-weight="700">Instalar</text><text x="165" y="307" fill="#c2d7e9" font-size="18">ZimaOS</text></g><path d="M285 255 H315" stroke="#82c9ff" stroke-width="5"/><path d="M306 245 L318 255 L306 265" fill="none" stroke="#82c9ff" stroke-width="5"/><g><rect x="330" y="145" width="220" height="220" rx="22" fill="#17334f" stroke="#4e91c2" stroke-width="3"/><circle cx="440" cy="205" r="34" fill="#2b83bf"/><text x="440" y="216" fill="white" font-size="30" font-weight="700">2</text><text x="440" y="275" fill="#fff" font-size="22" font-weight="700">Iniciar</text><text x="440" y="307" fill="#c2d7e9" font-size="18">Boot Repair Disk</text></g><path d="M560 255 H590" stroke="#82c9ff" stroke-width="5"/><path d="M581 245 L593 255 L581 265" fill="none" stroke="#82c9ff" stroke-width="5"/><g><rect x="605" y="145" width="220" height="220" rx="22" fill="#17334f" stroke="#4e91c2" stroke-width="3"/><circle cx="715" cy="205" r="34" fill="#2b83bf"/><text x="715" y="216" fill="white" font-size="30" font-weight="700">3</text><text x="715" y="275" fill="#fff" font-size="22" font-weight="700">Identificar</text><text x="715" y="307" fill="#c2d7e9" font-size="18">disco e partição EFI</text></g><path d="M835 255 H865" stroke="#82c9ff" stroke-width="5"/><path d="M856 245 L868 255 L856 265" fill="none" stroke="#82c9ff" stroke-width="5"/><g><rect x="880" y="145" width="220" height="220" rx="22" fill="#17334f" stroke="#4e91c2" stroke-width="3"/><circle cx="990" cy="205" r="34" fill="#2b83bf"/><text x="990" y="216" fill="white" font-size="30" font-weight="700">4</text><text x="990" y="275" fill="#fff" font-size="22" font-weight="700">Criar</text><text x="990" y="307" fill="#c2d7e9" font-size="18">entrada UEFI</text></g><path d="M1110 255 H1140" stroke="#82c9ff" stroke-width="5"/><path d="M1131 245 L1143 255 L1131 265" fill="none" stroke="#82c9ff" stroke-width="5"/><g><rect x="1155" y="145" width="190" height="220" rx="22" fill="#17334f" stroke="#4e91c2" stroke-width="3"/><circle cx="1250" cy="205" r="34" fill="#2b83bf"/><text x="1250" y="216" fill="white" font-size="30" font-weight="700">5</text><text x="1250" y="275" fill="#fff" font-size="22" font-weight="700">Reiniciar</text><text x="1250" y="307" fill="#c2d7e9" font-size="18">sem o pendrive</text></g></g><text x="700" y="435" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#aac5dc">Ajuste os identificadores do disco e da partição conforme a saída do seu próprio computador.</text></svg>